# Phase-1: fine-tune ViT on full public gasbench image registries (3-class).
# Backbone ~85.8M params. Single GPU. Batch 32 fp32 needs ~10-14 GB
# (16 GB minimum, 24 GB recommended). See README "GPU requirements".

experiment_name: vit_phase1_public
seed: 42

# External volume (3 TB): all downloads + index live here. Override with --data-dir
# or SN34_DATA_ROOT. Do not use ~/.cache for train data.
cache_dir: /mnt/sn34
index_path: /mnt/sn34/index.jsonl
manifest_dir: configs/manifests

# Gasbench registry YAMLs (fetched if missing)
registries:
  - https://raw.githubusercontent.com/BitMind-AI/gasbench/main/src/gasbench/dataset/configs/real_images.yaml
  - https://raw.githubusercontent.com/BitMind-AI/gasbench/main/src/gasbench/dataset/configs/synthetic_images.yaml

# GAS-Station (Phase 2; disabled by default in phase1)
gas_station:
  enabled: false
  path: gasstation/gs-images-v4
  media_type: synthetic
  max_samples: 20000
  weeks: null  # null = all available under cache

model:
  backbone: google/vit-base-patch16-224-in21k
  # Phase-3 alternatives: facebook/convnext-large-224, openai/clip-vit-large-patch14
  num_classes: 3
  image_size: 224
  label_smoothing: 0.05

data:
  max_per_source: 2000
  val_source_fraction: 0.1
  # Prefer holding out whole generator_family / dataset_name groups
  stratify_by: generator_family
  num_workers: 4
  # Robustness augs (Phase 2 style; light on by default)
  robustness_aug_prob: 0.0

train:
  output_dir: /mnt/sn34/runs/vit_phase1
  num_epochs: 5
  train_batch_size: 32
  eval_batch_size: 64
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 50
  early_stop_patience: 2
  metric_for_best: sn34_score

export:
  submission_dir: /mnt/sn34/submission
  zip_path: /mnt/sn34/submission/image_detector.zip
  resize: [224, 224]

eval:
  gasbench_cmd: gasbench
  small_timeout_s: 5100
  full_timeout_s: 18000

# Disk-budgeted training (3 TB volume → keep ~2.5 TiB data resident at a time).
# Use: python -m src.train_chunked --config configs/train_vit_phase1.yaml --data-dir "$DATA"
chunk:
  budget_tib: 2.5
  epochs_per_chunk: 3
  skip_gasstation: true
  # catalog_path / plan_path / state_path default under cache_dir and output_dir
  avg_stream_image_bytes: 256000  # cost estimate for repos too large to mirror
